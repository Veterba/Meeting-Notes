<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meeting Notes</title>
<style>
  :root{
    --bg:#f6f6f7; --panel:#fff; --ink:#1c1c1e; --dim:#6e6e73; --line:#e3e3e6;
    --accent:#0a84ff; --ok:#30a46c; --warn:#d97706; --bad:#e5484d;
    --radius:8px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#1c1c1e; --panel:#2c2c2e; --ink:#f2f2f7; --dim:#98989d;
           --line:#3a3a3c; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;}
  button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);border-radius:6px;padding:5px 11px;}
  button:hover{border-color:var(--dim)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:590}
  button.primary:hover{filter:brightness(1.08)}
  button.link{border:0;background:0;color:var(--accent);padding:2px 4px}
  button:disabled{opacity:.45;cursor:default}
  input,textarea,select{font:inherit;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;}
  textarea{resize:vertical;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  label{display:block;font-size:11px;font-weight:590;letter-spacing:.04em;
    text-transform:uppercase;color:var(--dim);margin:0 0 5px}

  section.pane{padding:18px 20px 40px;max-width:760px;margin:0 auto}
  .grid2{display:grid;grid-template-columns:1fr 150px;gap:12px}
  .field{margin-bottom:14px}
  .items{display:flex;flex-direction:column;gap:6px}
  .item{display:grid;grid-template-columns:150px 1fr 130px 26px;gap:6px;align-items:start}
  @media (max-width:720px){ .item{grid-template-columns:1fr} .grid2{grid-template-columns:1fr} }
  .x{border:0;background:0;color:var(--dim);padding:6px 0}
  .x:hover{color:var(--bad)}
  details{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
    background:var(--panel);margin-bottom:14px}
  summary{cursor:pointer;font-weight:590;font-size:12px}
  .assumption{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .quote{color:var(--dim);font-style:italic;margin-top:5px;font-size:12px}
  .bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    padding:10px 20px;display:flex;gap:9px;align-items:center;margin:0 -20px -40px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .note{font-size:12px;color:var(--dim)}
  .note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
  .empty{color:var(--dim);font-size:12px;padding:30px 0;text-align:center}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:10px 12px;font-size:12px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #job:not(:empty){padding:12px 20px 0;max-width:760px;margin:0 auto}
  progress{width:100%;height:5px;margin-top:8px}
</style>
</head>
<body>

<div id="job"></div>

<section class="pane" id="pane">
  <p class="empty">Pick a meeting from the menu bar to read its notes.</p>
</section>

<script>
const TOKEN = "__TOKEN__";
let STATE = null, NOTES = null, NOTES_PATH = null;

const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body){
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

// ---------------------------------------------------------------- the job strip

const STAGES = {map: "reading", reduce: "writing the notes",
                pull: "downloading the model", waiting: "waiting for Ollama"};

function jobLabel(j){
  const stage = STAGES[j.stage] || "working";
  return j.stage === "map" || j.stage === "pull"
    ? `${stage} ${j.i} of ${j.n}` : stage;
}

// One job state, whoever started it. The menu bar shows the same thing; here it
// says that a meeting is being summarised while you read another one.
function renderJob(j){
  if (!j) return;
  const waiting = j.queued ? `<span class="note">${j.queued} waiting</span>` : "";
  $("job").innerHTML = j.active
    ? `<div class="banner"><span>${esc(j.file)} — ${esc(jobLabel(j))}</span>${waiting}</div>`
    : (j.queued ? `<div class="banner">${waiting}</div>` : "");
}

async function refresh(){
  STATE = await api("/api/state");
  renderJob(STATE.job);
  const button = $("send-btn");
  if (button) button.textContent = sendLabel();
}

// ---------------------------------------------------------------- the editor

function sendLabel(){
  return STATE && STATE.mail_mode === "smtp" ? "Send over SMTP"
                                             : "Create draft in Outlook";
}

function lines(a){ return (a || []).join("\n"); }

async function openNotes(path){
  if (!STATE) await refresh();
  NOTES_PATH = path;
  NOTES = await api("/api/notes?path=" + encodeURIComponent(path));
  renderNotes();
}

function renderNotes(){
  const d = NOTES;
  $("pane").innerHTML = `
    <div class="grid2">
      <div class="field"><label>Title</label>
        <input id="f-title" value="${esc(d.title)}"></div>
      <div class="field"><label>Date</label>
        <input id="f-date" value="${esc(d.date)}"></div>
    </div>
    <div class="field"><label>Participants</label>
      <input id="f-participants" value="${esc((d.participants||[]).join(', '))}"></div>
    <div class="field"><label>Summary</label>
      <textarea id="f-summary" rows="7">${esc(d.summary)}</textarea></div>
    <div class="field"><label>Decisions — one per line</label>
      <textarea id="f-decisions" rows="4">${esc(lines(d.decisions))}</textarea></div>

    <div class="field"><label>Action items</label>
      <div class="items" id="f-actions"></div>
      <button class="link" onclick="addAction()">+ add</button></div>

    <div class="field"><label>Open questions — one per line</label>
      <textarea id="f-questions" rows="3">${esc(lines(d.open_questions))}</textarea></div>

    <details><summary>Assumptions the model made (${(d.assumptions||[]).length})</summary>
      <p class="note">Nothing here was said outright. Check the quote before relying on it.</p>
      <div id="f-assumptions"></div></details>

    <div class="field"><label>Recipients — one per line</label>
      <textarea id="f-recipients" rows="3">${esc(lines(
        (d.recipients && d.recipients.length ? d.recipients : (STATE.recipients || []))
      ))}</textarea></div>

    <div class="bar">
      <button onclick="saveNotes()">Save</button>
      <button class="primary" id="send-btn" onclick="send()">${sendLabel()}</button>
      <span class="note" id="status"></span>
    </div>`;
  renderActions();
  renderAssumptions();
}

function renderActions(){
  $("f-actions").innerHTML = (NOTES.action_items || []).map((a, i) => `
    <div class="item">
      <input class="a-owner" value="${esc(a.owner)}" placeholder="owner">
      <input class="a-task" value="${esc(a.task)}" placeholder="task">
      <input class="a-due" value="${esc(a.deadline || '')}" placeholder="due">
      <button class="x" onclick="removeAction(${i})">✕</button>
    </div>`).join("");
}

function renderAssumptions(){
  $("f-assumptions").innerHTML = (NOTES.assumptions || []).map((s, i) => `
    <div class="assumption" data-quote="${esc(s.evidence_quote)}">
      <div class="item" style="grid-template-columns:1fr 110px 26px">
        <input class="s-statement" value="${esc(s.statement)}">
        <select class="s-confidence">
          ${["low","medium","high"].map(l =>
            `<option ${s.confidence===l?"selected":""}>${l}</option>`).join("")}
        </select>
        <button class="x" onclick="removeAssumption(${i})">✕</button>
      </div>
      <div class="quote">“${esc(s.evidence_quote)}”</div>
    </div>`).join("") || `<p class="note">None — nothing was inferred.</p>`;
}

// Everything is read back out of the page, including the action items and the
// assumptions. Inline handlers cannot see the script's own variables, so the
// rows used to look edited and save unchanged.
function collect(){
  const split = id => $(id).value.split("\n").map(s => s.trim()).filter(Boolean);
  const rows = sel => [...document.querySelectorAll(sel)];
  NOTES.title = $("f-title").value.trim();
  NOTES.date = $("f-date").value.trim();
  NOTES.participants = $("f-participants").value.split(",").map(s => s.trim()).filter(Boolean);
  NOTES.summary = $("f-summary").value.trim();
  NOTES.decisions = split("f-decisions");
  NOTES.open_questions = split("f-questions");
  NOTES.action_items = rows("#f-actions .item").map(row => ({
    owner: row.querySelector(".a-owner").value.trim(),
    task: row.querySelector(".a-task").value.trim(),
    deadline: row.querySelector(".a-due").value.trim() || null,
  })).filter(a => a.owner || a.task);
  NOTES.assumptions = rows("#f-assumptions .assumption").map(row => ({
    statement: row.querySelector(".s-statement").value.trim(),
    confidence: row.querySelector(".s-confidence").value,
    evidence_quote: row.dataset.quote || "",
  })).filter(a => a.statement);
  return NOTES;
}

function addAction(){
  collect();
  NOTES.action_items.push({owner:"", task:"", deadline:null});
  renderActions();
}

function removeAction(i){
  collect();
  NOTES.action_items.splice(i, 1);
  renderActions();
}

function removeAssumption(i){
  collect();
  NOTES.assumptions.splice(i, 1);
  renderAssumptions();
}

function say(msg, cls){
  const el = $("status");
  if (el){ el.textContent = msg; el.className = "note " + (cls || ""); }
}

async function saveNotes(){
  await api("/api/notes", {path: NOTES_PATH, data: collect()});
  say("Saved", "ok");
}

async function send(){
  const recipients = $("f-recipients").value.split("\n").map(s => s.trim()).filter(Boolean);
  say("Working…");
  const data = collect();
  data.recipients = recipients;
  await api("/api/notes", {path: NOTES_PATH, data});
  const r = await api("/api/send", {data, recipients, path: NOTES_PATH});
  say(r.ok ? r.message : r.error, r.ok ? "ok" : "bad");
}

(async () => {
  await refresh();
  const wanted = new URLSearchParams(location.search).get("open");
  if (wanted) openNotes(wanted);
})();
setInterval(refresh, 3000);
</script>
</body>
</html>
